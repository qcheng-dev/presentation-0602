slide":16},{"type":"image","x":1268.57,"y":202.38,"w":178.47,"h":110.18,"z":38,"src":"assets/media/image97.png","name":"图片 69","sourceSlide":null,"slide":16}]},{"index":17,"title":"量产系统、数据闭环与验证链路已经存在","kind":"standard","elements":[{"type":"text","x":174.72,"y":41.89,"w":1384.42,"h":60.42,"z":7,"text":"天瞳在自动驾驶领域的研究基础","font":36,"color":"#C00000","bold":true,"title":true,"card":false,"slide":17,"sourceSlide":17},{"type":"text","x":52.23,"y":43.29,"w":61.68,"h":48.47,"z":15,"text":"04","font":24,"color":null,"bold":true,"title":false,"card":false,"slide":17,"sourceSlide":17},{"type":"text","x":76.79,"y":218.3,"w":445.2,"h":606.92,"z":17,"text":"天瞳量产系统\n多级别场景覆盖：从 L2/L2+ 辅助驾驶，到 L4 无人巴士、Robotaxi、无人重卡等未来出行业务，天瞳具备横跨量产乘用车与低速/开放道路无人驾驶的场景基础。\n多硬件平台适配能力：天瞳方案已适配 TI、NVIDIA、地平线等芯片平台，其工程能力不是只在高算力实验平台上成立，而是能面向不同车端算力、成本和量产约束做系统落地。\n规模化客户与部署基础：超400万车辆装备天瞳系统，运营城市超11个，Tier1s and OEMs客户超20家","font":24,"color":null,"bold":true,"title":false,"card":true,"slide":17,"sourceSlide":17},{"type":"text","x":660.48,"y":132.51,"w":244.82,"h":38.03,"z":18,"text":"核心能力","font":24,"color":"#FFFFFF","bold":true,"title":false,"card":false,"slide":17,"sourceSlide":17},{"type":"text","x":560.29,"y":218.03,"w":443.06,"h":643.27,"z":21,"text":"数据闭环与场景挖掘体系\n数据采集与回传：量产车和L4运营车辆持续产生真实道路数据，包括常规驾驶数据、异常事件、接管片段、功能边界场景、复杂交通交互等。\n高价值场景筛选：从海量数据中筛选真正有训练价值的样本，例如：鬼探头、异形障碍物、施工绕行、复杂路口、环岛、无保护左转、恶劣天气、非结构化窄路、交通流博弈等。\n场景标签与重构：将原始数据组织为可训练、可验证的场景资产，包括 ODD边界、道路结构、交通参与者行为、风险等级、接管原因、模型失败类型等。","font":24,"color":null,"bold":true,"title":false,"card":true,"slide":17,"sourceSlide":17},{"type":"text","x":1043.79,"y":218.97,"w":445.19,"h":649.33,"z":22,"text":"端到端模型的工程化部署经验\n算法链路演进：从CNN-based多摄融合，逐步演进到BEV-based空间表征，并进一步探索Drive E2E端到端架构，为世界模型与策略学习奠定工程基础。\n多传感器融合与冗余体系：天瞳方案覆盖摄像头、激光雷达、毫米波雷达等，具备感知冗余、控制冗余、底盘冗余、供电冗余、远程驾驶接管等安全体系，为模型实践提供工程边界与安全保障。\n从模型到系统的验证能力：端到端模型并非完成训练即可部署，还需经过多阶段验证。天瞳已有量产项目和 L4 运营项目，可承接端到端模型从实验室算法到真实道路系统的工程化验证链路。","font":24,"color":null,"bold":true,"title":false,"card":true,"slide":17,"sourceSlide":17}],"sourceIndex":17,"orig
